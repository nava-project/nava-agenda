# Configuración de PostgreSQL de NAVA (VPS de 4 vCPU / 7,6 GB; el contenedor
# tiene un límite de 1,5 GB, ver deploy/compose.yaml). Valores prudentes: lo
# justo para el volumen del piloto, sin acaparar memoria del servidor.
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 60                 # pool del API (20) + worker + respaldos + holgura

# Memoria
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 96MB
huge_pages = off

# WAL y checkpoints
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1               # disco SSD

# Seguridad: TLS obligatorio (el certificado lo crea entrypoint.sh) y SCRAM.
ssl = on
ssl_cert_file = '/run/nava-tls/server.crt'
ssl_key_file = '/run/nava-tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# Registro (stderr; Docker rota los logs)
log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 500ms
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
