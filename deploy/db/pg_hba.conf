# Autenticación de PostgreSQL de NAVA.
# Socket local: solo el usuario del sistema `postgres` dentro del contenedor
# (healthcheck y mantenimiento). Red: únicamente TLS con SCRAM.
local   all   all                    peer
hostssl all   all   0.0.0.0/0        scram-sha-256
hostssl all   all   ::/0             scram-sha-256
