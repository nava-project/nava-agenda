name: Deploy

# Despliegue a producción (VPS). Promueve un commit de `main` que ya superó el CI:
# no hay ramas por ambiente (docs/03-desarrollo/flujo-git-github.md).
#
# Se dispara solo (DEC-160) cuando el CI de un `push` a `main` termina en verde, y a mano
# (`workflow_dispatch`) para reintentar o volver a un SHA anterior de `main`. El control
# previo es el PR revisado y el CI; el posterior, el respaldo verificado, la simulación de
# migraciones y las pruebas de humo de deploy.sh, que detienen el despliegue si algo falla.
# Interruptor: la variable de repositorio AUTO_DEPLOY=false desactiva el disparo automático.
# El job `deploy` usa el entorno `production`, que solo admite `main` y guarda los secretos SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA de main a desplegar (vacío = último commit de main)"
        required: false
        default: ""

# Un solo despliegue a la vez y nunca se cancela uno en curso a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verificar commit
    # Manual: solo desde main (quien lo lance desde otra rama no despliega). Automático:
    # solo tras un `push` a main con el CI en verde y sin el interruptor apagado.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && vars.AUTO_DEPLOY != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      skip: ${{ steps.resolve.outputs.skip }}
      db_tag: ${{ steps.resolve.outputs.db_tag }}
      owner: ${{ steps.resolve.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolver el commit y exigir CI en verde
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Automático: el SHA que probó ese CI (no el GITHUB_SHA, que es la punta actual de main).
          if [ "$EVENT" = workflow_run ]; then ref="$RUN_SHA"; else ref="${INPUT_REF:-$GITHUB_SHA}"; fi
          sha="$(git rev-parse --verify "$ref^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha no pertenece a main"; exit 1; }

          # Si ya hay un commit más nuevo en main, su propio CI disparará su despliegue: este se
          # omite para no desplegar una versión vieja encima de una nueva.
          if [ "$EVENT" = workflow_run ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Se omite $sha: main ya avanzó" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ok="$(gh run list --workflow ci.yml --commit "$sha" --status success --json databaseId --jq length)"
          [ "$ok" -ge 1 ] \
            || { echo "::error::El CI de $sha no terminó en verde: no se despliega"; exit 1; }

          # La imagen de la base se versiona por contenido: solo cambia (y recrea
          # PostgreSQL) cuando cambian su configuración, sus scripts o su Dockerfile.
          db_tag="$(git rev-parse "$sha:deploy/db" "$sha:deploy/backup" "$sha:deploy/docker/db.Dockerfile" | sha1sum | cut -c1-12)"

          {
            echo "sha=$sha"
            echo "db_tag=$db_tag"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >>"$GITHUB_OUTPUT"
          echo "Desplegando $sha (imagen de base $db_tag)" >>"$GITHUB_STEP_SUMMARY"

  images:
    name: Imagen ${{ matrix.name }}
    needs: verify
    if: needs.verify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Sin el entorno, `vars.VITE_GOOGLE_MAPS_BROWSER_KEY` (variable del entorno
    # production) llegaba vacía y la SPA se compilaba sin mapas (issue #579).
    # Ojo: el entorno solo alcanza a los pasos, no a `strategy.matrix`, que se
    # resuelve antes; por eso el build-arg se arma en el paso de build (#583).
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            tag: ${{ needs.verify.outputs.sha }}
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
            tag: ${{ needs.verify.outputs.sha }}
          - name: db
            dockerfile: deploy/docker/db.Dockerfile
            tag: ${{ needs.verify.outputs.db_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          # Clave de NAVEGADOR de Google Maps, solo para la imagen web: pública por
          # diseño (se restringe por dominio en Google Cloud).
          build-args: ${{ matrix.name == 'web' && format('VITE_GOOGLE_MAPS_BROWSER_KEY={0}', vars.VITE_GOOGLE_MAPS_BROWSER_KEY) || '' }}
          tags: ghcr.io/${{ needs.verify.outputs.owner }}/barberia-${{ matrix.name }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Desplegar en el VPS
    needs: [verify, images]
    runs-on: ubuntu-latest
    # Secretos (VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS) y variables de este entorno.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      DB_TAG: ${{ needs.verify.outputs.db_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Enviar la versión al servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # SHA y DB_TAG se expanden aquí, en el cliente, a propósito (son hexadecimales).
          # shellcheck disable=SC2029
          # Solo lo necesario: compose, scripts y migraciones. El mismo commit que probó el CI.
          tar czf - deploy database/atlas.hcl database/migrations \
            | ssh "${ssh_opts[@]}" "deploy@$VPS_HOST" \
                "set -e; d=/srv/barberia/releases/$SHA; rm -rf \"\$d\"; mkdir -p \"\$d\"; tar xzpf - -C \"\$d\""

      - name: Desplegar (respaldo, migraciones, arranque, pruebas de humo)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # El token viaja por stdin: no queda en la línea de comandos ni en el disco del servidor.
          # shellcheck disable=SC2029
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "deploy@$VPS_HOST" \
            "DEPLOY_ACTOR='$GHCR_USER' bash /srv/barberia/releases/$SHA/deploy/scripts/deploy.sh $SHA --db-tag $DB_TAG --ghcr-user '$GHCR_USER'"

      - name: Comprobar HTTPS público
        if: ${{ vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 "$PUBLIC_URL/health" && exit 0
            sleep 10
          done
          echo "::error::$PUBLIC_URL/health no responde"; exit 1
