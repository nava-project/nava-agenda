<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Logo v2 «Horizonte» (DEC-188): favicon, PWA y atajo de Safari. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#101b2b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f0e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1022" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Nava Agenda · Agenda de citas</title>
    <!-- Antes de que llegue el CSS de la app: sin el margen del navegador, la
         primera pintura no se desplaza 8 px al cargar los estilos (CLS). -->
    <style>
      body {
        margin: 0;
      }

      /* Arranque (DEC-188, entrega 5a; #735): el modo guardado y la marca de la
         espera, el diamante dentro del sol, desde la primera pintura. En el
         panel mientras se resuelve la sesión; en la reserva y mi turno
         mientras llega la app. Es el mismo dibujo que SunDiamond.vue. */
      .boot-loader {
        display: none;
      }

      html[data-boot='panel'] {
        background-color: #0b1022;
      }

      html[data-boot='panel'][data-app-theme='ivory'],
      html[data-boot='public'] {
        background-color: #f4f0e7;
      }

      html[data-boot] .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        font:
          19px/26px 'Instrument Serif',
          Georgia,
          serif;
        color: #eef1f8;
        background-color: #0b1022;
        --boot-ray: #c9a86f;
      }

      html[data-boot='panel'][data-app-theme='ivory'] .boot-loader,
      html[data-boot='public'] .boot-loader {
        color: #101b2b;
        background-color: #f4f0e7;
        --boot-ray: #b8955a;
      }

      @media (prefers-color-scheme: dark) {
        html[data-boot='public'] {
          background-color: #0b1022;
        }

        html[data-boot='public'] .boot-loader {
          color: #eef1f8;
          background-color: #0b1022;
          --boot-ray: #c9a86f;
        }
      }

      .boot-loader__mark {
        width: 72px;
        height: 72px;
        overflow: visible;
        animation: boot-loader-in 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 300ms backwards;
      }

      .boot-loader__text {
        animation: boot-loader-fade 200ms ease-out 300ms backwards;
      }

      html[data-boot='panel'] .boot-loader__text--public,
      html[data-boot='public'] .boot-loader__text--panel {
        display: none;
      }

      .boot-loader__rays,
      .boot-loader__sun,
      .boot-loader__gem {
        transform-box: view-box;
        transform-origin: 24px 24px;
      }

      .boot-loader__rays {
        fill: var(--boot-ray);
        animation: boot-loader-turn 9s linear infinite;
      }

      .boot-loader__sun {
        fill: #f4b740;
        animation: boot-loader-breathe 1.6s ease-in-out infinite alternate;
      }

      /* Las cuatro caras del latón, como en SunDiamond.vue. */
      .boot-loader__facet-1 {
        fill: color-mix(in srgb, var(--boot-ray) 55%, #fff);
      }

      .boot-loader__facet-2 {
        fill: color-mix(in srgb, var(--boot-ray) 30%, #fff);
      }

      .boot-loader__facet-3 {
        fill: color-mix(in srgb, var(--boot-ray) 80%, #000);
      }

      .boot-loader__facet-4 {
        fill: var(--boot-ray);
      }

      .boot-loader__gem {
        animation: boot-loader-breathe 1.6s ease-in-out infinite alternate-reverse;
      }

      @keyframes boot-loader-turn {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-loader-breathe {
        from {
          transform: scale(0.94);
        }

        to {
          transform: scale(1.05);
        }
      }

      @keyframes boot-loader-in {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-45deg);
        }
      }

      @keyframes boot-loader-fade {
        from {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader,
        .boot-loader * {
          animation: none !important;
        }
      }

      html[data-motion='reduced'] .boot-loader,
      html[data-motion='reduced'] .boot-loader * {
        animation: none !important;
      }
    </style>
    <!-- Solo en /panel: pinta el modo del panel guardado en este dispositivo
         (DEC-110, `nava.appearance.v1`) antes de que cargue la app, para que
         quien usa Noche no vea un fogonazo claro en cada recarga. Sin valor
         guardado vale lo mismo que la app: Noche. `app/bootstrap/bootLoader.ts`
         lo retira al resolver la primera navegación. -->
    <script>
      ;(function () {
        var path = window.location.pathname
        if (/^\/(reservar|mi-turno)(\/|$)/.test(path)) {
          // La reserva y mi turno siguen el modo del sistema: solo la espera.
          document.documentElement.setAttribute('data-boot', 'public')
          return
        }
        if (!/^\/panel(\/|$)/.test(path)) return
        var prefs = {}
        try {
          prefs = JSON.parse(window.localStorage.getItem('nava.appearance.v1') || '{}') || {}
        } catch (error) {
          prefs = {}
        }
        var theme = prefs.theme === 'ivory' ? 'ivory' : 'ink'
        if (prefs.theme === 'auto' && window.matchMedia) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'ivory' : 'ink'
        }
        var root = document.documentElement
        root.setAttribute('data-app-theme', theme)
        if (prefs.motion === 'reduced') root.setAttribute('data-motion', 'reduced')
        root.setAttribute('data-boot', 'panel')
      })()
    </script>
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" role="status" aria-live="polite">
      <svg class="boot-loader__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <g class="boot-loader__rays">
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(45 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(90 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(135 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(180 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(225 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(270 24 24)" />
          <path d="M24 0 L25.8 2.6 L24 5.2 L22.2 2.6 Z" transform="rotate(315 24 24)" />
        </g>
        <defs>
          <mask id="boot-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
            <rect width="48" height="48" fill="#fff" />
            <path d="M24 11 L37 24 L24 37 L11 24 Z" fill="#000" />
          </mask>
        </defs>
        <circle class="boot-loader__sun" cx="24" cy="24" r="17.5" mask="url(#boot-cut)" />
        <g class="boot-loader__gem">
          <path class="boot-loader__facet-1" d="M24 13.5 L13.5 24 L24 24 Z" />
          <path class="boot-loader__facet-2" d="M24 13.5 L34.5 24 L24 24 Z" />
          <path class="boot-loader__facet-3" d="M34.5 24 L24 34.5 L24 24 Z" />
          <path class="boot-loader__facet-4" d="M13.5 24 L24 34.5 L24 24 Z" />
        </g>
      </svg>
      <span class="boot-loader__text boot-loader__text--panel">Abriendo tu agenda…</span>
      <span class="boot-loader__text boot-loader__text--public">Abriendo…</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
