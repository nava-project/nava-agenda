# Cuerpo de POST /public/barbershops/{slug}/customer-access/verify-ref (HU-106).
type: object
additionalProperties: false
properties:
  accessRef:
    type: string
    minLength: 1
    maxLength: 128
    description: La referencia del enlace que Odin entregó.
  code:
    type: string
    pattern: '^[0-9]{6}$'
    description: Código de 6 dígitos que llegó por WhatsApp.
    examples:
      - "482913"
required:
  - accessRef
  - code
