# Cuerpo de PATCH /private/professionals/{professionalId}/holiday-calendar
# (CA-041-01/02). Cerrado: un único campo, sin businessId ni professionalId (el
# tenant se deriva de SessionCookie, el profesional de la ruta).
type: object
description: >
  Activa o desactiva el calendario colombiano de festivos del profesional de la
  ruta. La decisión nunca afecta a otro profesional del mismo negocio.
properties:
  enabled:
    type: boolean
    description: Nuevo estado del calendario colombiano de festivos.
    examples:
      - true
required:
  - enabled
additionalProperties: false
