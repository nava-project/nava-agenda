# Representación pública mínima de un negocio habilitado (HU-090,
# CA-090-01, CA-090-04): nombre, zona horaria IANA, contacto público
# opcional y vocabulario del negocio (DEC-119). Nunca un identificador interno (id, businessId) ni el slug
# mismo: el visitante llega con el slug en la URL, nunca lo necesita en el
# cuerpo de la respuesta.
type: object
additionalProperties: false
description: >
  Contexto público del negocio resuelto por su enlace de reservas.
  contactEmail/contactPhone viajan siempre presentes en el cuerpo, con
  valor `null` explícito cuando el negocio no tiene ese contacto
  configurado (nunca se omiten ni se representan como cadena vacía), misma
  convención que BusinessSettingsResponse.
properties:
  name:
    type: string
    description: Nombre público del negocio, ya recortado.
    maxLength: 120
    examples:
      - Negocio Ejemplo
  timezone:
    type: string
    description: >
      Zona horaria IANA del negocio (RN-DIS-07). El cliente la usa para
      mostrar la hora local del negocio, nunca la del dispositivo.
    maxLength: 64
    examples:
      - America/Bogota
  contactEmail:
    type: [string, "null"]
    format: email
    description: Correo de contacto público del negocio; null cuando no está configurado.
    maxLength: 254
    examples:
      - contacto@ejemplo.test
  contactPhone:
    type: [string, "null"]
    description: Teléfono de contacto público del negocio en formato E.164; null cuando no está configurado.
    examples:
      - "+573001234567"
  vocabulary:
    $ref: './PublicVocabulary.yaml'
  location:
    oneOf:
      - $ref: './PublicLocation.yaml'
      - type: "null"
    description: >
      Ubicación física del negocio (`DEC-130`). `null` salvo que el negocio
      haya activado la ubicación y tenga coordenadas: con el interruptor
      apagado, o sin dirección geocodificada, la reserva pública no pinta
      ninguna sección.
  offersHomeService:
    type: boolean
    description: >
      Si el negocio atiende a domicilio (`DEC-131`). Con `true` el cliente puede
      elegir «a domicilio» al reservar e indicar su dirección.
  brandAccent:
    $ref: './BrandAccent.yaml'
    description: >
      Color de acento que el negocio eligió en Configuración (`DEC-110`). La
      reserva pública de este negocio pinta con él sus acentos (`DEC-171`).
      Siempre presente; `brass` es el valor inicial.
  openingHours:
    type: array
    description: >
      Horario semanal del local (`DEC-182`), ordenado por día (lunes primero) y
      apertura, en la hora civil de `timezone`. Un día sin tramos está cerrado.
      Vacío significa que el negocio no lo ha configurado: no se sabe, no que
      cierre toda la semana. Es informativo; la disponibilidad real sale de los
      horarios de los profesionales.
    maxItems: 28
    items:
      $ref: './OpeningHoursSegment.yaml'
  closedOnHolidays:
    type: boolean
    description: El local cierra los festivos colombianos (`DEC-182`).
  today:
    oneOf:
      - $ref: './PublicOpeningToday.yaml'
      - type: "null"
    description: >
      Lo que rige hoy con el festivo aplicado (`DEC-182`); `null` cuando
      `openingHours` está vacío.
required:
  - name
  - timezone
  - contactEmail
  - contactPhone
  - vocabulary
  - location
  - offersHomeService
  - brandAccent
  - openingHours
  - closedOnHolidays
  - today
