# Cuerpo de POST /integrations/odin/barbershops/{slug}/customer-access/challenge (HU-106).
type: object
additionalProperties: false
properties:
  phone:
    type: string
    minLength: 1
    maxLength: 32
    description: El mismo celular E.164 con el que se hizo `lookup`.
    examples:
      - "+573001234567"
  appointmentRef:
    type: string
    minLength: 1
    maxLength: 128
    description: La referencia que `lookup` entregó para ese turno.
  purpose:
    $ref: './CustomerAccessPurpose.yaml'
required:
  - phone
  - appointmentRef
  - purpose
