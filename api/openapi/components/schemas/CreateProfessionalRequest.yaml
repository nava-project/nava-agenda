# Cuerpo de POST /private/professionals (CA-021-02, CA-021-03). Cerrado: el
# handler rechaza cualquier campo desconocido, mismo criterio que
# UpdateBusinessSettingsRequest. Nunca declara businessId (el tenant se
# deriva de SessionCookie) ni ningún campo fuera de alcance de HU-021
# (active, staffUserId, servicios, horario).
type: object
description: >
  Alta de un profesional del negocio activo. La clave de idempotencia no
  convierte el nombre en único: dos claves distintas pueden crear dos
  profesionales con el mismo `fullName` (fuera de alcance de HU-021 inventar esa
  restricción).
properties:
  fullName:
    type: string
    minLength: 1
    maxLength: 120
    description: >
      Nombre visible del profesional. El servidor recorta espacios; un valor
      vacío, compuesto solo por espacios o mayor de 120 caracteres responde
      `422` sin persistir nada (CA-021-03).
    examples:
      - Carlos Ramírez
  description:
    type:
      - string
      - "null"
    maxLength: 280
    description: >
      Descripción corta y opcional del profesional (DEC-127), visible en la reserva
      pública. El servidor recorta espacios; ausente, `null`, vacía o de solo
      espacios equivale a «sin descripción». Más de 280 caracteres responde
      `422` sin persistir nada.
    examples:
      - Fade, barba y navaja con más de diez años en el oficio.
required:
  - fullName
additionalProperties: false
