# Un inicio público válido atribuido a un profesional (DEC-162): la unidad del
# agregado de disponibilidad por servicio.
type: object
description: >
  Inicio válido de `professionalId`: el intervalo [startsAt, startsAt +
  durationMinutes) cabe entero en su jornada efectiva y no interseca ninguna
  cita que ocupe agenda ni ningún bloqueo vigente. Es el mismo inicio que la
  operación por profesional devuelve para ese profesional.
properties:
  professionalId:
    type: string
    format: uuid
    description: Profesional al que pertenece el inicio.
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
  barberId:
    type: string
    format: uuid
    deprecated: true
    description: >
      Mismo valor que `professionalId`. Se conserva mientras Odin no lea
      `professionalId` (DEC-183, issue #661); después se retira.
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
  startsAt:
    type: string
    format: date-time
    description: >
      Instante absoluto de inicio (ISO 8601 con offset explícito). El cliente
      lo presenta en la zona horaria del negocio (`timezone`), nunca en la
      del dispositivo (RN-DIS-07).
    examples:
      - "2026-09-15T09:00:00-05:00"
required:
  - professionalId
  - barberId
  - startsAt
