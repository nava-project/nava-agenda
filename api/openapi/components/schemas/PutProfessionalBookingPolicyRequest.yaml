# Cuerpo de PUT /private/settings/booking-policy/professionals/{professionalId}
# (DEC-169). Contrato cerrado y completo: los tres campos son obligatorios.
# Sin If-Match: reemplazo completo e idempotente de un registro pequeño e
# independiente (último escritor). El plazo y la política de cancelación no
# forman parte: siguen siendo del negocio.
type: object
description: Reemplazo completo de la ventana de reserva propia de un profesional.
properties:
  minAdvanceMinutes:
    type: integer
    minimum: 0
    maximum: 1440
    examples:
      - 30
  maxAdvanceDays:
    type: integer
    minimum: 1
    maximum: 90
    examples:
      - 7
  slotGridMinutes:
    type: integer
    minimum: 1
    maximum: 60
    examples:
      - 40
required:
  - minAdvanceMinutes
  - maxAdvanceDays
  - slotGridMinutes
additionalProperties: false
