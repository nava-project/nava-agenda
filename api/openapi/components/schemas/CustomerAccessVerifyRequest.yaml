# Cuerpo de POST /public/businesses/{slug}/customer-access/verify (HU-105).
type: object
additionalProperties: false
description: El contacto y el código de 6 dígitos que le llegó.
properties:
  contact:
    type: string
    minLength: 1
    maxLength: 254
    description: El mismo contacto con el que se pidió el código.
  code:
    type: string
    pattern: '^[0-9]{6}$'
    description: Código de 6 dígitos.
    examples: ["482913"]
required:
  - contact
  - code
