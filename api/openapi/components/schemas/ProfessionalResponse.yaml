# Representación canónica de un profesional (HU-021, CA-021-01/02/07):
# exactamente id, fullName, createdAt, updatedAt y, por DEC-104,
# photoUpdatedAt y, por DEC-127, description. Nunca active, deletedAt, sortOrder, staffUserId, servicios
# ni horarios (DEC-047): esos campos pertenecen a una historia futura que los
# apruebe explícitamente.
# businessId NUNCA aparece, mismo criterio que BusinessSettingsResponse:
# el tenant se deriva exclusivamente de SessionCookie.
type: object
description: >
  Profesional del negocio activo. La misma forma representa tanto a la única
  persona de un negocio unipersonal como a cualquiera de los varios
  profesionales de un equipo (CA-021-01): no existe una forma especial para
  "profesional único".
properties:
  id:
    type: string
    format: uuid
    description: Identificador del profesional, opaco para el cliente.
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
  fullName:
    type: string
    minLength: 1
    maxLength: 120
    description: Nombre visible del profesional, ya recortado por el servidor.
    examples:
      - Carlos Ramírez
  createdAt:
    type: string
    format: date-time
    description: Instante de alta, con offset.
    examples:
      - "2026-08-23T15:04:05Z"
  updatedAt:
    type: string
    format: date-time
    description: Instante de la última modificación (alta o renombrado), con offset.
    examples:
      - "2026-08-23T15:04:05Z"
  photoUpdatedAt:
    type:
      - string
      - "null"
    format: date-time
    description: >
      Instante de la última fotografía del profesional (DEC-104), con offset, o
      `null` si no tiene ninguna (el cliente muestra su monograma). Es la
      versión de la imagen: el cliente la añade a la URL de
      `GET /private/professionals/{professionalId}/photo` para no reutilizar una copia
      vieja al cambiarla.
    examples:
      - "2026-09-30T12:00:00Z"
      - null
  description:
    type:
      - string
      - "null"
    minLength: 1
    maxLength: 280
    description: >
      Descripción corta del profesional (DEC-127), o `null` si no tiene. Es
      contenido público: la reserva pública la muestra junto a su nombre y su
      fotografía.
    examples:
      - Fade, barba y navaja con más de diez años en el oficio.
      - null
  rating:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
    description: >
      Promedio de 1 decimal de las reseñas no ocultas del profesional (`DEC-128`),
      o `null` mientras no tenga ninguna visible. Se calcula en cada consulta.
    examples:
      - 4.8
      - null
  ratingCount:
    type: integer
    minimum: 0
    description: Total de reseñas no ocultas del profesional (`DEC-128`); `0` sin ninguna.
    examples:
      - 12

required:
  - id
  - fullName
  - createdAt
  - updatedAt
  - photoUpdatedAt
  - description
  - rating
  - ratingCount
