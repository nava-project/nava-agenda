# Proyección mínima del turno del cliente (HU-098, CA-098-01, CA-098-03):
# nunca un identificador interno (id, businessId, appointmentId,
# customerId), contacto del cliente, nota, historial ni ningún otro turno.
# cancellationDeadlineMinutes/lateCancellation* son la política VIGENTE de
# el negocio (misma forma que BookingPolicyResponse.yaml, HU-093), no un
# valor fijado al reservar: cambia si el negocio edita su política después.
type: object
additionalProperties: false
description: >
  Lectura mínima del turno del cliente, autenticada únicamente por la
  credencial del enlace (HU-098). Nunca incluye un identificador interno ni
  datos de contacto: el cliente ya los conoce, y exponerlos aquí no cumple
  ningún criterio de aceptación.
properties:
  businessName:
    type: string
    description: Nombre del negocio, mismo campo que PublicBusinessProfile.name.
    maxLength: 120
    examples:
      - Negocio Ejemplo
  timezone:
    type: string
    description: >
      Zona horaria IANA del negocio (RN-DIS-07). startsAt/endsAt viajan
      en UTC; el cliente los presenta en esta zona, nunca en la del
      dispositivo.
    maxLength: 64
    examples:
      - America/Bogota
  attendeeName:
    type: string
    description: Persona atendida (RN-RES-03), tal como quedó fijada al confirmar.
    maxLength: 120
    examples:
      - Cliente Ejemplo
  serviceName:
    type: string
    description: Snapshot del nombre del servicio al confirmar (DEC-004), no el catálogo vigente.
    maxLength: 120
    examples:
      - Corte clásico
  durationMinutes:
    type: integer
    description: Snapshot de la duración del servicio al confirmar (DEC-004).
    minimum: 1
    maximum: 1440
    examples:
      - 30
  professionalName:
    type: string
    description: Nombre del profesional asignado al turno.
    maxLength: 120
    examples:
      - Profesional Ejemplo
  startsAt:
    type: string
    format: date-time
    description: Instante absoluto de inicio del turno, en UTC.
  endsAt:
    type: string
    format: date-time
    description: Instante absoluto de fin del turno, en UTC.
  status:
    type: string
    description: >
      Estado vigente del turno (nava-docs/agenda/02-requisitos/estados-citas.md).
      `confirmed` NUNCA implica que la falta de respuesta del cliente vaya a
      cancelarlo (RN-CNF-02, CA-098-04).
    enum: [confirmed, completed, cancelled_by_customer, cancelled_by_professional, no_show]
    examples:
      - confirmed
  cancellationDeadlineMinutes:
    type: integer
    description: >
      Minutos de anticipación exigidos para cancelar sin política tardía
      (HU-093), medidos hacia atrás desde startsAt. Política VIGENTE del
      negocio, no un valor fijado al reservar.
    minimum: 0
    maximum: 10080
    examples:
      - 20
  lateCancellationClientAllowed:
    type: boolean
    description: Si el cliente puede cancelar después del plazo (HU-093, HU-099 la ejerce).
    examples:
      - true
  lateCancellationReasonRequired:
    type: boolean
    description: Si una cancelación tardía exige motivo (HU-093, HU-099 la exige).
    examples:
      - true
  versionToken:
    type: string
    minLength: 1
    description: >
      Token opaco de versión del turno (`HU-099`): se envía tal cual como
      `If-Match` al cancelar. Nunca se decodifica ni se persiste; si el turno
      cambió desde esta lectura, la cancelación responde `409` con
      `code: version-conflict`.
    examples:
      - 3n9Kq1x2v8pQwZbJt5Yc0Rr6Hh4Ss7Ff1Gg3Dd8Ee2Aa
  businessContactEmail:
    type: [string, "null"]
    maxLength: 254
    description: >
      Correo público opcional del negocio (`HU-020`, el mismo de la reserva
      pública): el contacto seguro al que acudir cuando la política rechaza
      la cancelación (`CA-099-06`). `null` si no lo configuró.
  businessContactPhone:
    type: [string, "null"]
    maxLength: 32
    description: Teléfono público opcional del negocio; mismo propósito que `businessContactEmail`.
  vocabulary:
    $ref: './PublicVocabulary.yaml'
  canReview:
    type: boolean
    description: >
      `true` solo con el turno `completed` y sin reseña todavía (`HU-100`,
      `CA-100-01`): es la señal para ofrecer «Calificar».
    examples:
      - true
  review:
    oneOf:
      - $ref: './CustomerReview.yaml'
      - type: "null"
    description: La reseña que el cliente ya dejó sobre este turno, o `null`.
  rescheduleRemaining:
    type: integer
    minimum: 0
    maximum: 2
    description: >
      Veces que el cliente todavía puede cambiar la hora de este turno por su
      cuenta (`HU-104`, `DEC-178`: máximo 2 por turno; las del profesional no
      cuentan). El plazo es el mismo de la cancelación: hasta
      `startsAt - cancellationDeadlineMinutes`, y con plazo 0 nunca. La
      interfaz ofrece «Cambiar la hora» solo con el turno `confirmed`, dentro
      de plazo y con este valor mayor que 0; el servidor lo vuelve a decidir.
    examples:
      - 2
required:
  - businessName
  - timezone
  - attendeeName
  - serviceName
  - durationMinutes
  - professionalName
  - startsAt
  - endsAt
  - status
  - cancellationDeadlineMinutes
  - lateCancellationClientAllowed
  - lateCancellationReasonRequired
  - versionToken
  - businessContactEmail
  - businessContactPhone
  - vocabulary
  - canReview
  - review
  - rescheduleRemaining
