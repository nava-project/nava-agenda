# Disponibilidad pública de un servicio para todos sus profesionales (DEC-162).
type: object
description: >
  Inicios públicos válidos del servicio para todos sus profesionales elegibles,
  ordenados por (`startsAt`, `professionalId`), más el contexto mínimo para
  interpretarlos (RN-DIS-07). Un arreglo `slots` vacío cubre por igual "sin
  disponibilidad en la ventana pública vigente" y un `serviceId` ajeno,
  inexistente, inactivo o sin ningún profesional con asignación vigente: la causa
  nunca se distingue (mismo criterio que CA-092-03). Nunca reserva ni aparta
  ninguna franja (RN-DIS-03): es una proyección de solo lectura.
properties:
  slots:
    type: array
    description: >
      Inicios válidos de todos los profesionales elegibles, ordenados por
      (`startsAt`, `professionalId`).
    items:
      $ref: './ProfessionalAvailabilitySlotResponse.yaml'
  durationMinutes:
    type: integer
    minimum: 0
    description: >
      Duración planificada del servicio (DEC-002). 0 cuando `serviceId` no
      produjo ningún profesional con asignación activa vigente.
    examples:
      - 45
  timezone:
    type: string
    description: >
      Zona horaria IANA del negocio (RN-DIS-07). Cadena vacía cuando
      `serviceId` no produjo ningún profesional con asignación activa vigente.
    examples:
      - America/Bogota
  slotGridMinutes:
    type: integer
    minimum: 0
    description: >
      Paso de la rejilla vigente del negocio (RN-DIS-06, DEC-083). 0
      cuando `serviceId` no produjo ningún profesional con asignación activa
      vigente.
    examples:
      - 30
required:
  - slots
  - durationMinutes
  - timezone
  - slotGridMinutes
