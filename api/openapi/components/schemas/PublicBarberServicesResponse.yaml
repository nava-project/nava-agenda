# Barbero elegible con los servicios activos que hace (DEC-162). Mismos campos
# `id` y `fullName` que PublicBarberResponse; nunca descripción, fotografía,
# reseñas ni un identificador de tenant.
type: object
description: >
  Barbero de la barbería resuelta con al menos una asignación vigente a un
  servicio activo, junto con los ids de esos servicios (DEC-162).
properties:
  id:
    type: string
    format: uuid
    description: Identificador del barbero, necesario para seleccionarlo al reservar.
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
  fullName:
    type: string
    minLength: 1
    maxLength: 120
    description: Nombre completo visible del barbero.
    examples:
      - Juan Pérez
  serviceIds:
    type: array
    minItems: 1
    uniqueItems: true
    description: >
      Ids de los servicios ACTIVOS que el barbero tiene asignados, ordenados
      por fecha de alta del servicio y luego por id. Un servicio inactivo no
      figura aunque conserve la asignación.
    items:
      type: string
      format: uuid
    examples:
      - - 1c9a7f2d-3b4e-4a5f-9c6d-7e8f9a0b1c2d
        - 5e2d9b7a-6c1f-4d38-8a40-b3c5e7f90a12
required:
  - id
  - fullName
  - serviceIds
