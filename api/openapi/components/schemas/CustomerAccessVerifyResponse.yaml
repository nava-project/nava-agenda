# Cuerpo de la respuesta 200 de POST .../customer-access/verify (HU-105).
type: object
additionalProperties: false
description: Los turnos futuros confirmados del cliente, del más próximo al más lejano.
properties:
  timezone:
    type: string
    description: Zona IANA del negocio; las horas se muestran en ella (RN-DIS-07).
    examples: [America/Bogota]
  appointments:
    type: array
    minItems: 1
    maxItems: 10
    items:
      $ref: './CustomerAccessAppointment.yaml'
required:
  - timezone
  - appointments
