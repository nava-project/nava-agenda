# Para qué se pidió el acceso al turno (HU-106, DEC-179, DEC-180, DEC-181): decide qué
# muestra la página tras verificar el código.
type: string
enum: [manage, cancel, reschedule]
description: >
  `manage` abre el paso 03 «Tu turno» con las dos acciones (cambiar la hora y
  cancelar): Odin ya confirmó el turno con el cliente y la persona elige en la página.
  `cancel` abre directamente la confirmación de la cancelación; `reschedule` lleva a
  «Cambiar la hora».
examples:
  - manage
