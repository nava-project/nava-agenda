# Cuerpo de PUT /private/me/professional (DEC-100). Cerrado: solo `professionalId`, el
# profesional que el usuario autenticado declara ser. Nunca lleva un
# `staffUserId`: el usuario es siempre el principal de la sesión, de modo que
# nadie puede asignar el vínculo de otra persona.
type: object
description: >
  Selección del profesional propio del usuario autenticado. Si el usuario ya
  estaba vinculado a otro profesional, el vínculo anterior se libera en la misma
  operación.
properties:
  professionalId:
    type: string
    format: uuid
    description: >
      Identificador del profesional del negocio activo que el usuario declara
      ser. Un identificador inexistente o de otro negocio responde el mismo
      `404` que el resto de operaciones del profesional (`CA-021-05`).
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
required:
  - professionalId
additionalProperties: false
