# 422 de PUT /private/settings/opening-hours (HU-107, DEC-182). Mismo schema que
# ValidationProblem.yaml; solo cambian los ejemplos.
description: >
  El cuerpo es JSON válido, pero falta un campo, un día u hora está mal escrito,
  un tramo cierra antes de abrir, dos tramos del mismo día se solapan o un día
  pasa de 4 tramos. Ninguna escritura ocurre cuando esto sucede.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      solape:
        summary: Dos tramos del mismo día se solapan
        value:
          type: /api/v1/problems/validation-error
          title: Error de validación
          status: 422
          detail: 'MONDAY: los tramos 09:00–13:00 y 12:00–18:00 se solapan'
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: validation-error
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      horaMalEscrita:
        summary: Hora con otro formato
        value:
          type: /api/v1/problems/validation-error
          title: Error de validación
          status: 422
          detail: 'openingHours[0]: opens debe tener la forma HH:MM'
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: validation-error
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
