# 204 de DELETE
# /private/professionals/{professionalId}/working-hours/{workingHourId} (HU-040,
# CA-040-05). Sin cuerpo (nava-docs/agenda/06-api/estandar-openapi.md sección 11).
description: >
  El tramo ya no forma parte de la jornada laboral del profesional. Retiro
  físico (working_hour no tiene eliminación lógica); no afecta al profesional,
  al negocio ni a ningún otro tramo.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
