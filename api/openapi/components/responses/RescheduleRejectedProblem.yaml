# 422 de POST /customer/appointments/{token}/reschedule (HU-104, DEC-178): la
# política rechaza la reprogramación. No se persistió nada ni se consumió la
# clave de idempotencia.
description: >
  Tres rechazos distinguibles por `code`, nunca por `detail`:
  `reschedule-window-closed` (pasó el plazo, el mismo de la cancelación: el
  cliente debe contactar a la barbería), `reschedule-limit-reached` (el cliente
  ya cambió la hora de este turno las veces permitidas) y `validation-error`
  (`startsAt` no es un instante RFC 3339).
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      plazoVencido:
        value:
          type: /api/v1/problems/reschedule-window-closed
          title: Plazo de reprogramación vencido
          status: 422
          detail: el plazo para cambiar la hora por tu cuenta ya venció; contacta a la barbería
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: reschedule-window-closed
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      limiteAlcanzado:
        value:
          type: /api/v1/problems/reschedule-limit-reached
          title: Límite de reprogramaciones alcanzado
          status: 422
          detail: ya cambiaste la hora de este turno las veces permitidas; contacta a la barbería
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: reschedule-limit-reached
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      inicioInvalido:
        value:
          type: /api/v1/problems/validation-error
          title: Error de validación
          status: 422
          detail: startsAt debe ser un instante RFC 3339
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: validation-error
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
