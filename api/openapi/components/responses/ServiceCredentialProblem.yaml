# Respuesta 401 de las rutas de servicio de Odin (HU-106, CA-106-01).
description: >
  La credencial de servicio falta o no es válida. La misma respuesta cubre una
  cabecera ausente, de otro esquema o con un secreto distinto.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
  WWW-Authenticate:
    description: Siempre `Bearer`.
    schema:
      type: string
      enum: [Bearer]
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      credencialInvalida:
        value:
          type: /api/v1/problems/unauthorized
          title: No autorizado
          status: 401
          detail: credencial de servicio inválida
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: unauthorized
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
