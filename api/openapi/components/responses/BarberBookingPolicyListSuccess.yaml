# Respuesta 200 de GET /private/settings/booking-policy/barbers (DEC-169).
description: Ventanas de reserva propias de la barbería activa (los barberos ausentes heredan).
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/BarberBookingPolicyListResponse.yaml'
    examples:
      unBarberoPropio:
        summary: Un barbero con ventana propia; el resto hereda
        value:
          items:
            - barberId: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d
              minAdvanceMinutes: 30
              maxAdvanceDays: 7
              slotGridMinutes: 40
      todosHeredan:
        summary: Ningún barbero tiene ventana propia
        value:
          items: []
