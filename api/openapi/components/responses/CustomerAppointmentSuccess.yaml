# Respuesta 200 de GET /customer/appointments/{token} (HU-098, CA-098-01).
description: Lectura mínima del turno correspondiente a la credencial del enlace.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
  Cache-Control:
    description: >
      Siempre `no-store` (RN-DAT-02): evita que un caché compartido o del
      navegador retenga el turno de otra persona que use el mismo equipo.
    schema:
      type: string
      enum: [no-store]
content:
  application/json:
    schema:
      $ref: '../schemas/CustomerAppointmentResponse.yaml'
    examples:
      turnoConfirmado:
        summary: Turno confirmado, cancelación tardía permitida con motivo
        value:
          businessName: Negocio Ejemplo
          timezone: America/Bogota
          attendeeName: Cliente Ejemplo
          serviceName: Corte clásico
          durationMinutes: 30
          professionalName: Profesional Ejemplo
          startsAt: "2027-03-15T15:00:00Z"
          endsAt: "2027-03-15T15:30:00Z"
          status: confirmed
          cancellationDeadlineMinutes: 20
          lateCancellationClientAllowed: true
          lateCancellationReasonRequired: true
          versionToken: 3n9Kq1x2v8pQwZbJt5Yc0Rr6Hh4Ss7Ff1Gg3Dd8Ee2Aa
          businessContactEmail: contacto@negocio-ejemplo.test
          businessContactPhone: "+573001234567"
          vocabulary:
            businessTerm: negocio
            businessTermGender: feminine
            professionalTerm: profesional
            professionalTermPlural: profesionales
            professionalTermGender: masculine
          canReview: false
          review: null
          rescheduleRemaining: 2
      turnoCompletadoSinReseña:
        summary: Turno completado; el cliente aún puede calificar (HU-100)
        value:
          businessName: Negocio Ejemplo
          timezone: America/Bogota
          attendeeName: Cliente Ejemplo
          serviceName: Corte clásico
          durationMinutes: 30
          professionalName: Profesional Ejemplo
          startsAt: "2027-03-15T15:00:00Z"
          endsAt: "2027-03-15T15:30:00Z"
          status: completed
          cancellationDeadlineMinutes: 20
          lateCancellationClientAllowed: true
          lateCancellationReasonRequired: true
          versionToken: 3n9Kq1x2v8pQwZbJt5Yc0Rr6Hh4Ss7Ff1Gg3Dd8Ee2Aa
          businessContactEmail: null
          businessContactPhone: null
          vocabulary:
            businessTerm: negocio
            businessTermGender: feminine
            professionalTerm: profesional
            professionalTermPlural: profesionales
            professionalTermGender: masculine
          canReview: true
          review: null
          rescheduleRemaining: 2
