# Slug público del negocio en las rutas de servicio de Odin (HU-106, DEC-179).
# Lo usan los alias deprecados `/integrations/odin/barbershops/{slug}/…` (DEC-183).
name: slug
in: path
required: true
description: Identificador público del negocio (HU-090).
schema:
  type: string
  maxLength: 120
examples:
  slug:
    value: negocio-ejemplo
