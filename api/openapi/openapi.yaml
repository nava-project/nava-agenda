# Documento de entrada del contrato HTTP. Fuente de verdad según
# docs/06-api/estandar-openapi.md (DEC-037). No se edita el bundle generado
# en dist/; este archivo y los que referencia son la fuente.
#
# La historia de cada operación (qué issue, HU o DEC la agregó o cambió) vive en
# CHANGELOG.md. Desde 1.0.0 (DEC-183, issue #661) el contrato habla de negocios
# (`businesses`) y profesionales (`professionals`); la tabla de equivalencias con
# los nombres anteriores está en esa versión del CHANGELOG.
openapi: 3.1.2
info:
  title: API de Nava Agenda
  version: 1.1.0
  description: >
    Contrato HTTP entre apps/web y apps/api. Tres audiencias comparten este
    documento: /api/v1/public (reserva sin sesión), /api/v1/customer
    (acceso por token del enlace de la cita) y /api/v1/private (sesión del
    profesional), según docs/04-arquitectura/backend-go.md sección 7.
  license:
    name: Propietaria, uso interno del proyecto
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Identidad, sesiones y recuperación de acceso del profesional.
  - name: Settings
    description: Configuración general del negocio.
  - name: Staff
    description: Registro y listado de los profesionales del negocio.
  - name: Catalog
    description: >-
      Catálogo básico de servicios del negocio (HU-022), su asignación a
      profesionales (HU-023) y su ciclo de desactivación/reactivación (HU-024).
  - name: Schedule
    description: >-
      Horario laboral recurrente de cada profesional (HU-040), calendario
      colombiano de festivos y excepciones de jornada por fecha (HU-041), y
      bloqueos de agenda puntuales y recurrentes (HU-042).
  - name: Booking
    description: >-
      Registro de turnos: creación manual por el profesional (HU-061), con
      historial e idempotencia reutilizada de HU-004/HU-060.
  - name: PublicBooking
    description: >-
      Flujo público de reserva sin sesión del profesional: entrada por el
      enlace de un negocio (HU-090), catálogo público de servicios
      (HU-091), selección pública de profesional (HU-092), disponibilidad
      pública real (HU-094) y confirmación pública concurrente e
      idempotente (HU-097). El acceso/cancelación del cliente mediante el
      token emitido por HU-097 vive en el tag CustomerAccess, bajo
      /customer.
  - name: CustomerAccess
    description: >-
      Acceso del cliente a su propio turno mediante la credencial aleatoria
      larga del enlace que HU-097 envió por correo, sin sesión ni cuenta:
      lectura mínima (HU-098). La cancelación por el cliente (HU-099) se
      agrega después a este mismo tag.
  - name: Integrations
    description: >-
      Integraciones del profesional con servicios externos. Hoy, la publicación
      unidireccional de sus citas en SU Google Calendar (DEC-099): conexión
      OAuth con PKCE, estado, recordatorio y desconexión. NAVA manda; Google
      es una vista y nunca modifica citas ni disponibilidad.
  - name: Webhooks
    description: >-
      Notificaciones que envían proveedores externos a NAVA. Hoy, el webhook de
      Meta WhatsApp Cloud API (estados de entrega y mensajes entrantes,
      DEC-126). Lo llama el proveedor, no el frontend; se autentica con un
      token de verificación y la firma HMAC del cuerpo, nunca con sesión.
