# Operaciones de acceso del cliente mediante el token del enlace de su cita
# (consultar, cancelar y reprogramar). Ver nava-docs/agenda/06-api/estandar-openapi.md. HU-098 agrega
# la primera: GET /customer/appointments/{token}, lectura mínima autenticada
# únicamente por la credencial del enlace, sin sesión. La cancelación
# (HU-099, T5) vive en este mismo archivo: POST .../cancel.
# security: [] en cada operación, según nava-docs/agenda/06-api/estandar-openapi.md: la
# audiencia customer no usa el esquema de sesión del profesional, la credencial
# viaja en la ruta, no en una cabecera de autorización.
/customer/appointments/{token}:
  get:
    tags: [CustomerAccess]
    summary: Consultar el turno del cliente mediante la credencial de su enlace
    description: >
      Resuelve `token` -la credencial aleatoria larga que HU-097 emitió una
      sola vez dentro de la transacción de confirmación y envió por correo
      (DEC-089)- al turno correspondiente, sin sesión (HU-098, CA-098-01).
      El servidor nunca recibe ni compara el valor en claro directamente
      contra la base de datos: lo hashea con SHA-256 antes de resolver el
      tenant mediante `public_resolve_appointment_token_tenant`, la función
      `SECURITY DEFINER` estrecha que agrega la migración
      `20260916120000_add_public_resolve_appointment_token_tenant.sql`
      (mismo patrón exacto que `public_resolve_business_by_slug`, HU-090).
      Un `token` con forma inválida, inexistente, vencido o ya revocado
      (al anonimizarse la cita, RN-DAT-03) produce
      EXACTAMENTE la misma respuesta `404` uniforme (CA-098-02, RN-TEN-01):
      esta operación nunca distingue la causa. Cancelar NO revoca el enlace
      (`DEC-136`): un turno cancelado responde `200` con su `status`
      cancelado, sin acciones disponibles. La respuesta trae solo los
      datos mínimos ya autorizados por HU-098 (negocio, persona atendida,
      servicio, profesional, intervalo/zona, estado y política vigente de
      cancelación); nunca un identificador interno, contacto del cliente,
      nota, historial ni ningún otro turno (CA-098-03). `status` nunca
      implica que la falta de respuesta del cliente vaya a cancelar el
      turno (RN-CNF-02, CA-098-04).
    operationId: getCustomerAppointment
    security: []
    x-business-rules: [RN-CNF-01, RN-CNF-02, RN-DAT-01, RN-DAT-02, RN-DAT-03, RN-TEN-01]
    x-decisions: [DEC-016, DEC-022, DEC-024, DEC-025, DEC-049, DEC-077, DEC-078, DEC-079, DEC-089, DEC-091, DEC-110, DEC-119]
    parameters:
      - name: token
        in: path
        required: true
        description: >
          Credencial en claro del enlace de acceso al turno (DEC-089). No es
          un identificador interno: el servidor solo la usa para calcular su
          hash y resolver el tenant; nunca se registra ni persiste en claro
          (CA-098-02).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
    responses:
      "200":
        $ref: '../components/responses/CustomerAppointmentSuccess.yaml'
      "404":
        description: >
          `token` con forma inválida, inexistente, vencido o revocado, sin
          distinguir la causa (CA-098-02, RN-TEN-01).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              enlaceNoAccesible:
                value:
                  type: /api/v1/problems/not-found
                  title: No encontrado
                  status: 404
                  detail: no existe un turno accesible con ese enlace
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: not-found
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/review:
  post:
    tags: [CustomerAccess]
    summary: Calificar al profesional de un turno completado
    description: >
      El cliente deja una calificación de 1 a 5 y un comentario opcional sobre
      el profesional que lo atendió (HU-100, `DEC-128`), con la misma credencial del
      enlace de su turno y sin sesión. Solo un turno `completed` sin reseña
      admite una: un turno no completado, cancelado o ya calificado responde
      siempre el mismo `409`, sin distinguir la causa (`CA-100-01`); un `token`
      inexistente, vencido o revocado responde el mismo `404` uniforme que
      `GET`. Como máximo una reseña por turno (`CA-100-03`): repetir la llamada
      no crea otra fila ni modifica la existente, así que no necesita
      `Idempotency-Key`. La reseña queda visible de inmediato en la selección
      pública del profesional y cuenta en su promedio.
    operationId: createCustomerAppointmentReview
    security: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-089, DEC-104, DEC-128]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateReviewRequest.yaml'
          examples:
            conComentario:
              value:
                rating: 5
                comment: Muy buen corte y puntual.
            soloEstrellas:
              value:
                rating: 4
    responses:
      "201":
        $ref: '../components/responses/ReviewCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        $ref: '../components/responses/ReviewNotAvailableProblem.yaml'
      "422":
        $ref: '../components/responses/ValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/cancel:
  post:
    tags: [CustomerAccess]
    summary: Cancelar el turno por el cliente (T5)
    description: >
      El cliente cancela su turno `confirmed` con la credencial del enlace y
      sin sesión (`HU-099`, `T5` de `estados-citas.md`). Solo procede si la
      política VIGENTE del negocio lo autoriza, evaluada con el reloj del
      servidor y nunca con uno enviado por el cliente (`RN-CAN-01`,
      `RN-CAN-02`): hasta `startsAt - cancellationDeadlineMinutes` inclusive es
      dentro de plazo; después y antes de `startsAt` solo procede con
      `lateCancellationClientAllowed` y, si `lateCancellationReasonRequired`,
      con un `reason` no vacío; con el turno ya iniciado nunca procede. Un plazo
      de 0 minutos trata toda cancelación como tardía (`DEC-083`). Protegida con
      `Idempotency-Key` (`RN-IDE-01`, `DEC-043`) y con la precondición `If-Match`
      (el `versionToken` de `GET`): una repetición exacta reproduce la respuesta
      sin duplicar el historial. En una sola transacción el turno pasa a
      `cancelled_by_customer`, se registra el motivo y un único evento con actor
      cliente. El enlace NO se revoca (`DEC-136`): `GET` sigue mostrando el
      turno cancelado y repetir la misma llamada (misma `Idempotency-Key`)
      reproduce la respuesta original. La franja vuelve de inmediato a la
      disponibilidad pública (`HU-094`). Un `token` inexistente, vencido o
      revocado responde el mismo `404` uniforme que `GET`, sin revelar la
      causa. Notificar al profesional queda para B5.
    operationId: cancelCustomerAppointment
    security: []
    x-business-rules: [RN-CAN-01, RN-CAN-02, RN-CIT-03, RN-HIS-01, RN-HIS-02, RN-IDE-01, RN-TEN-01]
    x-decisions: [DEC-010, DEC-016, DEC-024, DEC-041, DEC-043, DEC-083, DEC-089]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
      - $ref: '../components/parameters/IdempotencyKey.yaml'
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CancelCustomerAppointmentRequest.yaml'
          examples:
            conMotivo:
              value:
                reason: Me surgió un imprevisto de trabajo.
            sinCuerpo:
              summary: Dentro de plazo el cuerpo puede omitirse
              value: {}
    responses:
      "200":
        $ref: '../components/responses/CustomerAppointmentCancelled.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          Tres conflictos distinguibles por `code`, nunca por `detail`:
          conflicto de idempotencia (misma clave con otro contenido u otra
          operación) u operación en curso con la misma clave; conflicto de
          versión (`code: version-conflict`, el `If-Match` ya no coincide: el
          turno cambió desde que se leyó); o estado inválido
          (`code: invalid-state`, el turno ya no está `confirmed`, p. ej. ya lo
          resolvió el profesional).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, contenido distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              versionDesactualizada:
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: el turno cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              estadoInvalido:
                value:
                  type: /api/v1/problems/invalid-state
                  title: Estado inválido
                  status: 409
                  detail: el turno ya no está confirmado; recarga para ver su estado actual
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: invalid-state
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/CancellationRejectedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/reschedule-slots:
  get:
    tags: [CustomerAccess]
    summary: Franjas a las que el cliente puede mover su turno
    description: >
      Devuelve los inicios a los que el cliente puede mover su turno
      `confirmed` (`HU-104`, `DEC-178`), con la misma credencial del enlace y
      sin sesión. Es el mismo cálculo de la disponibilidad pública (`HU-094`:
      jornada efectiva, bloqueos, citas, rejilla y anticipación mínima y
      máxima) para el profesional y la duración del turno, pero el propio
      turno no cuenta como ocupado: se puede mover a una franja que se cruza
      con su hora actual. Un turno que ya no está `confirmed` devuelve la lista
      vacía. No evalúa el plazo ni el límite: eso lo decide `POST .../reschedule`
      y la interfaz ya lo sabe por `GET` (`rescheduleRemaining`). Un `token`
      inexistente, vencido o revocado responde el mismo `404` uniforme que
      `GET`.
    operationId: listCustomerRescheduleSlots
    security: []
    x-business-rules: [RN-DIS-01, RN-DIS-07, RN-CON-01, RN-TEN-01]
    x-decisions: [DEC-089, DEC-135, DEC-178]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
    responses:
      "200":
        $ref: '../components/responses/CustomerRescheduleSlotsSuccess.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/reschedule:
  post:
    tags: [CustomerAccess]
    summary: Reprogramar el turno por el cliente
    description: >
      El cliente mueve su turno `confirmed` a otro inicio con la credencial del
      enlace y sin sesión (`HU-104`, `DEC-178`). Solo cambian fecha y hora:
      servicio, profesional, precio y duración se conservan. Reglas, evaluadas
      con el reloj del servidor:
      plazo igual al de la cancelación (hasta
      `startsAt - cancellationDeadlineMinutes` inclusive; con plazo 0 nunca);
      como máximo 2 reprogramaciones hechas por el cliente en el mismo turno;
      y `startsAt` debe ser uno de los inicios de `GET .../reschedule-slots`,
      que el servidor recalcula. Protegida con `Idempotency-Key` (`RN-IDE-01`,
      `DEC-043`) y con `If-Match` (el `versionToken` de `GET`). En una sola
      transacción, con la fila bloqueada, se mueve el intervalo (un cruce en
      carrera lo rechaza la exclusión de PostgreSQL con `409 slot-conflict`),
      se regenera el recordatorio, se encola la publicación en Google
      Calendar y se registra un evento `appointment_rescheduled` con actor
      cliente. No se envía aviso al cliente, porque el cambio lo hizo él
      (`DEC-142`). Un intervalo idéntico es un éxito sin escritura. Un `token`
      inexistente, vencido o revocado responde el mismo `404` uniforme que
      `GET`.
    operationId: rescheduleCustomerAppointment
    security: []
    x-business-rules: [RN-CAN-01, RN-CIT-01, RN-CON-01, RN-HIS-01, RN-IDE-01, RN-TEN-01]
    x-decisions: [DEC-043, DEC-083, DEC-089, DEC-142, DEC-144, DEC-178]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
      - $ref: '../components/parameters/IdempotencyKey.yaml'
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/RescheduleCustomerAppointmentRequest.yaml'
          examples:
            nuevaHora:
              value:
                startsAt: "2026-11-20T20:00:00Z"
    responses:
      "200":
        $ref: '../components/responses/CustomerAppointmentRescheduled.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          Cuatro conflictos distinguibles por `code`, nunca por `detail`:
          `slot-conflict` (la hora elegida ya no está disponible, también si
          otra reserva la ganó en carrera: hay que volver a pedir las franjas);
          `version-conflict` (el turno cambió desde que se leyó);
          `invalid-state` (el turno ya no está `confirmed`); y los de
          idempotencia (misma clave con otro contenido u operación en curso).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              franjaOcupada:
                value:
                  type: /api/v1/problems/slot-conflict
                  title: Franja no disponible
                  status: 409
                  detail: ese horario ya no está disponible; elige otro
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: slot-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              versionDesactualizada:
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: el turno cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              estadoInvalido:
                value:
                  type: /api/v1/problems/invalid-state
                  title: Estado inválido
                  status: 409
                  detail: el turno ya no está confirmado; recarga para ver su estado actual
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: invalid-state
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/RescheduleRejectedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

# HU-105 (DEC-178): acceso al turno con un código de un solo uso, para quien no
# tiene el enlace del correo. Cuelga del negocio (`/public/businesses/{slug}`)
# porque el contacto solo identifica a alguien dentro de un negocio.
/public/businesses/{slug}/customer-access/challenge:
  post:
    tags: [CustomerAccess]
    summary: Pedir un código para entrar a tu turno
    description: >
      Pide un código de 6 dígitos para entrar a cambiar la hora de un turno
      (HU-105). Responde siempre `202` con el mismo cuerpo, exista o no un
      cliente con ese contacto (CA-105-01); solo si lo hay y tiene algún turno
      futuro confirmado se envía el código, en segundo plano: por correo si el
      contacto es un correo y por WhatsApp si es un celular. El código vence a
      los 10 minutos, sirve una vez y admite 5 intentos. Pedir otro deja inútil
      el anterior. Límites: 3 solicitudes por contacto y 10 por IP en 15 minutos,
      contando también los contactos que no existen; superarlos responde `429`
      con `Retry-After`. Un `slug` inexistente o no publicable responde el mismo
      `404` uniforme de `GET /public/businesses/{slug}`. Un contacto con forma
      inválida responde `422` sin decir nada de si existe.
    operationId: requestCustomerAccessCode
    security: []
    x-business-rules: [RN-DAT-01, RN-DAT-02, RN-TEN-01]
    x-decisions: [DEC-062, DEC-089, DEC-141, DEC-178]
    parameters:
      - name: slug
        in: path
        required: true
        description: Identificador público del negocio (HU-090).
        schema:
          type: string
          maxLength: 120
        examples:
          slug:
            value: negocio-ejemplo
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerAccessChallengeRequest.yaml'
          examples:
            porCorreo:
              value:
                contact: ana.perez@correo.test
            porCelular:
              value:
                contact: 300 123 4567
    responses:
      "202":
        $ref: '../components/responses/CustomerAccessChallengeAccepted.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/ValidationProblem.yaml'
      "429":
        $ref: '../components/responses/RateLimitedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/public/businesses/{slug}/customer-access/verify:
  post:
    tags: [CustomerAccess]
    summary: Canjear el código por el acceso a tus turnos
    description: >
      Verifica el código recibido (HU-105, CA-105-02) y, si es válido, lo
      consume y emite un acceso de 60 minutos por cada turno futuro confirmado
      del cliente, hasta 10. Cada `accessToken` se usa como el `token` del
      enlace en `/customer/appointments/{token}…`, así que todo lo que el
      enlace permite (ver el turno, cambiar la hora) funciona con él mientras
      dure. Un código incorrecto, vencido, ya usado, agotado, de otro contacto
      o de un contacto que no existe producen exactamente la misma respuesta
      `401`: no se puede saber cuál ocurrió. Cada código incorrecto cuenta un
      intento; al quinto, ni el código correcto sirve y hay que pedir otro. La
      respuesta lleva credenciales en claro: `Cache-Control: no-store`.
    operationId: verifyCustomerAccessCode
    security: []
    x-business-rules: [RN-DAT-01, RN-DAT-02, RN-TEN-01]
    x-decisions: [DEC-062, DEC-089, DEC-141, DEC-178]
    parameters:
      - name: slug
        in: path
        required: true
        description: Identificador público del negocio (HU-090).
        schema:
          type: string
          maxLength: 120
        examples:
          slug:
            value: negocio-ejemplo
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerAccessVerifyRequest.yaml'
          examples:
            codigo:
              value:
                contact: ana.perez@correo.test
                code: "482913"
    responses:
      "200":
        $ref: '../components/responses/CustomerAccessVerified.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        description: >
          Código incorrecto, vencido, ya usado, agotado, de otro contacto o de
          un contacto inexistente, sin distinguir la causa (CA-105-02).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              codigoInvalido:
                value:
                  type: /api/v1/problems/unauthorized
                  title: No autorizado
                  status: 401
                  detail: código de verificación inválido o expirado
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: unauthorized
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/ValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/public/businesses/{slug}/customer-access/verify-ref:
  post:
    tags: [CustomerAccess]
    summary: Canjear el código de un enlace de Odin por el acceso a ese turno
    description: >
      Verifica el código que llegó por WhatsApp para la referencia del enlace
      `/reservar/{slug}/mi-turno/{accessRef}` (HU-106, CA-106-05) y, si es válido,
      lo consume y emite UN acceso de 60 minutos a ese turno, con el propósito para
      el que se pidió. El código vale 10 minutos, sirve una vez y admite 5 intentos.
      Una referencia inexistente, de otro negocio, vencida, ya usada o agotada, o
      un código incorrecto, producen exactamente el mismo `401`: no se puede saber
      cuál ocurrió. El acceso emitido es el mismo de `HU-105` y se usa como el
      `token` de `/customer/appointments/{token}…`. La respuesta lleva una credencial
      en claro: `Cache-Control: no-store`.
