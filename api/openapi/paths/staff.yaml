# Operaciones privadas de registro y listado de profesionales (HU-021,
# F-CONF-02 parcial: solo registrar, listar, consultar y renombrar. No
# mezcla con servicios, horario ni agenda por profesional -esas capacidades
# tienen su propio archivo cuando existan (catalog.yaml, schedules.yaml)-
# ni con credenciales o roles de staff_user (DEC-047).
/private/professionals:
  get:
    tags: [Staff]
    summary: Listar los profesionales del negocio activo
    description: >
      Lista paginada por cursor (HU-021, CA-021-01, CA-021-02) de los
      profesionales del negocio derivado de la sesión vigente. Un negocio
      unipersonal y una de cuatro profesionales usan exactamente la misma forma
      de respuesta: nunca una rama especial para "profesional único". Orden
      estable por fecha de alta y luego por identificador; sin paginación
      por offset porque la colección no tiene un máximo de negocio
      aprobado. Para una cuenta de empleado (`DEC-173`) la lista contiene
      solo su propio profesional, o ninguno si no tiene uno vinculado.
    operationId: listProfessionals
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: cursor
        in: query
        required: false
        description: >
          Cursor opaco devuelto por una página anterior (`nextCursor`). Sin
          este parámetro, la respuesta empieza en la primera página.
        schema:
          type: string
        examples:
          continuacion:
            value: eyJjcmVhdGVkQXQiOiIyMDI2LTA4LTIzVDE1OjA1OjEwWiIsImlkIjoiMWEyYjNjNGQtNWU2Zi00NzA4LTlhMGItMWMyZDNlNGY1MDYxIn0=
      - name: limit
        in: query
        required: false
        description: Máximo de profesionales por página.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        examples:
          porDefecto:
            value: 20
      - name: page
        in: query
        description: Modo numerado (DEC-107). No combinar con cursor/limit; fuera de rango se ajusta a la última página.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        description: Filas del modo numerado. No combinar con cursor/limit.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    responses:
      "200":
        $ref: '../components/responses/ProfessionalListSuccess.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  post:
    tags: [Staff]
    summary: Registrar un profesional en el negocio activo
    description: >
      Alta de un profesional (HU-021, CA-021-02) protegida con clave de
      idempotencia (RN-IDE-01, DEC-043): repetir el mismo `POST` con la
      misma `Idempotency-Key` y el mismo cuerpo devuelve la misma
      representación creada sin crear una segunda fila. La misma clave con
      un `fullName` distinto responde `409` (conflicto de idempotencia); una
      clave nueva con el mismo `fullName` que un profesional existente SÍ crea
      un segundo profesional -esta historia no impone unicidad de nombre-. El
      tenant se deriva exclusivamente de `SessionCookie`; el cuerpo nunca
      acepta `businessId`.
    operationId: createProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02, RN-IDE-01]
    x-decisions: [DEC-019, DEC-024, DEC-043, DEC-047]
    parameters:
      - $ref: '../components/parameters/IdempotencyKey.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateProfessionalRequest.yaml'
          examples:
            altaSimple:
              summary: Alta de un profesional
              value:
                fullName: Carlos Ramírez
    responses:
      "201":
        $ref: '../components/responses/ProfessionalCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "409":
        description: >
          Conflicto de idempotencia (misma clave con otro contenido u otra
          operación, `IdempotencyConflictProblem`) u operación en curso con
          la misma clave (`IdempotencyLockedProblem`, DEC-043). Mismos dos
          problem types reutilizables que HU-004 ya documenta; ver esos
          componentes para la forma completa de cada uno.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, cuerpo distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              operacionEnCurso:
                summary: Otra transacción tiene el bloqueo de esta clave ahora mismo
                value:
                  type: /api/v1/problems/idempotency-locked
                  title: Operación en curso
                  status: 409
                  detail: la operación con esta clave de idempotencia todavía está en curso; reintenta en unos segundos
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-locked
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/ProfessionalValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/professionals/{professionalId}:
  get:
    tags: [Staff]
    summary: Consultar un profesional del negocio activo
    description: >
      Lectura autenticada de un profesional por identificador (HU-021). Un
      identificador inexistente o perteneciente a otro negocio responde
      exactamente el mismo `404` (`CA-021-05`, `RN-TEN-01`): esta operación
      permite demostrar ese criterio de forma directa, sin depender solo del
      listado.
    operationId: getProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: professionalId
        in: path
        required: true
        description: Identificador del profesional.
        schema:
          type: string
          format: uuid
        examples:
          profesional:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    responses:
      "200":
        $ref: '../components/responses/ProfessionalSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Staff]
    summary: Renombrar un profesional del negocio activo
    description: >
      Actualización parcial limitada al nombre (HU-021, CA-021-04). Rechaza
      objetos vacíos y cualquier campo distinto de `fullName` -en particular
      `active`, `deletedAt`, `sortOrder`, `staffUserId`, servicios u
      horarios, todos fuera de alcance (`DEC-047`, `CA-021-07`)-. Un
      identificador inexistente o de otro negocio responde el mismo `404`
      que `GET` (`CA-021-05`).
    operationId: renameProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: professionalId
        in: path
        required: true
        description: Identificador del profesional.
        schema:
          type: string
          format: uuid
        examples:
          profesional:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateProfessionalRequest.yaml'
          examples:
            renombrar:
              summary: Nuevo nombre
              value:
                fullName: Carlos A. Ramírez
    responses:
      "200":
        $ref: '../components/responses/ProfessionalUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/ProfessionalValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/professionals/{professionalId}/photo:
  put:
    tags: [Staff]
    summary: Subir o reemplazar la fotografía de un profesional
    description: >
      Guarda la fotografía del profesional (DEC-104), el retrato que la lista del
      equipo y los selectores de profesional muestran en lugar del monograma. El
      cuerpo es la imagen binaria (`image/jpeg` o `image/png`), no JSON ni
      base64: el cliente la recorta a un cuadrado y la reduce a 512 px antes de
      enviarla, y el servidor la valida (formato real por sus bytes, no por el
      `Content-Type`; máximo 512 KiB; entre 64 y 1024 px por lado). Es un `PUT`:
      repetir la misma imagen deja el mismo estado y reemplazar una fotografía
      existente nunca crea una segunda, por eso no lleva `Idempotency-Key`.
      Responde el profesional completo con el nuevo `photoUpdatedAt`. Un
      identificador inexistente o de otro negocio responde el mismo `404`
      que `GET /private/professionals/{professionalId}` (`CA-021-05`).
    operationId: putProfessionalPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: professionalId
        in: path
        required: true
        description: Identificador del profesional.
        schema:
          type: string
          format: uuid
        examples:
          profesional:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    requestBody:
      required: true
      description: >
        Imagen ya recortada y reducida por el cliente. Se descartan
        metadatos: el servidor solo conserva los bytes validados y su tipo.
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    responses:
      "200":
        $ref: '../components/responses/ProfessionalPhotoUpdated.yaml'
      "400":
        $ref: '../components/responses/PayloadTooLargeProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/ProfessionalPhotoValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  get:
    tags: [Staff]
    summary: Leer la fotografía de un profesional
    description: >
      Sirve los bytes de la fotografía del profesional (DEC-104). Se usa como
      `src` de una imagen: la cookie de sesión viaja sola y el tenant se
      deriva de ella. Lleva `ETag` (derivado de `photoUpdatedAt`) y responde
      `304` a una solicitud condicional con `If-None-Match`; el cliente añade
      `photoUpdatedAt` como parámetro de consulta de la URL solo para
      invalidar su propia caché, el servidor lo ignora. Un profesional sin
      fotografía, inexistente o de otro negocio responde exactamente el mismo
      `404`: la lista ya dice cuáles tienen fotografía con `photoUpdatedAt`.
    operationId: getProfessionalPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: professionalId
        in: path
        required: true
        description: Identificador del profesional.
        schema:
          type: string
          format: uuid
        examples:
          profesional:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
      - name: If-None-Match
        in: header
        required: false
        description: Validador `ETag` de la copia que el cliente ya tiene.
        schema:
          type: string
    responses:
      "200":
        $ref: '../components/responses/ProfessionalPhotoSuccess.yaml'
      "304":
        $ref: '../components/responses/ProfessionalPhotoNotModified.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  delete:
    tags: [Staff]
    summary: Quitar la fotografía de un profesional
    description: >
      Borra la fotografía del profesional (DEC-104): la imagen se elimina, no se
      oculta, y el profesional vuelve a mostrarse con su monograma. Es idempotente:
      quitar una fotografía que no existe también responde `204`. No modifica
      el nombre ni ningún otro dato. Un identificador inexistente o de otro
      negocio responde el mismo `404` que el resto de operaciones del
      profesional (`CA-021-05`).
    operationId: deleteProfessionalPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: professionalId
        in: path
        required: true
        description: Identificador del profesional.
        schema:
          type: string
          format: uuid
        examples:
          profesional:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    responses:
      "204":
        $ref: '../components/responses/ProfessionalPhotoDeleted.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/me/professional:
  get:
    tags: [Staff]
    summary: Consultar el profesional vinculado al usuario autenticado
    description: >
      Devuelve el profesional que el usuario autenticado declaró ser (`DEC-100`).
      El vínculo es opcional: el dueño que no atiende clientes puede no tener
      profesional y recibe `200` con `professional: null` (`DEC-192`). «Sin
      ficha» es un estado, no un error, así que no hay `404`. Nunca expone la
      identidad de otro usuario.
    operationId: getMyProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-047, DEC-099, DEC-100, DEC-192]
    responses:
      "200":
        $ref: '../components/responses/MyProfessionalSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  put:
    tags: [Staff]
    summary: Declarar cuál profesional es el usuario autenticado
    description: >
      Vincula al usuario autenticado con un profesional del negocio activo
      (`DEC-100`). Actúa siempre sobre el principal de la sesión y el cuerpo
      nunca acepta un identificador de usuario, así que nadie asigna el vínculo
      de otra persona. Si el usuario ya estaba vinculado a otro profesional, ese
      vínculo se libera en la misma transacción. Es idempotente: repetir la
      misma selección deja el mismo estado y responde `200`, por eso no lleva
      `Idempotency-Key`. Un profesional ya vinculado a otro usuario responde `409`.
      Un identificador inexistente o de otro negocio responde el mismo `404`
      que el resto de operaciones del profesional (`CA-021-05`).
    operationId: linkMyProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-047, DEC-099, DEC-100]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/LinkMyProfessionalRequest.yaml'
          examples:
            vincular:
              summary: Soy este profesional
              value:
                professionalId: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    responses:
      "200":
        $ref: '../components/responses/ProfessionalUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        $ref: '../components/responses/MyProfessionalLinkConflictProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  delete:
    tags: [Staff]
    summary: Quitar el vínculo del usuario autenticado con su profesional
    description: >
      Libera el vínculo propio (`DEC-100`). Es idempotente: sin vínculo también
      responde `204`. No borra ni desactiva al profesional (`DEC-047`) y no afecta
      a sus citas.
    operationId: unlinkMyProfessional
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-047, DEC-099, DEC-100]
    responses:
      "204":
        $ref: '../components/responses/MyProfessionalUnlinked.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

