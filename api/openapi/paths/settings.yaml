# Operaciones privadas de configuración del negocio. HU-020 agrega la
# primera capacidad real: consultar y actualizar el nombre, la zona horaria
# IANA y el contacto opcional (correo, teléfono) del negocio activo.
# HU-093 agrega la política pública de reserva y cancelación (anticipación,
# ventana, rejilla, plazo y cancelación tardía) como una operación propia
# bajo /private/settings/booking-policy, con su propia precondición de
# versión (If-Match): nunca comparte el schema ni el versionado de
# /private/settings/business.
/private/settings/business:
  get:
    tags: [Settings]
    summary: Consultar la configuración básica del negocio activo
    description: >
      Lectura autenticada (HU-020, CA-020-01) de los cuatro campos
      autorizados del negocio derivado de la sesión vigente: nombre,
      zona horaria IANA y contacto opcional (correo, teléfono).
      `businessId` nunca es un parámetro de esta operación -el tenant se
      deriva exclusivamente de `SessionCookie`- así que no existe un canal
      para pedir la configuración de otro negocio (`CA-020-05`).
    operationId: getBusinessSettings
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-07, RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024]
    responses:
      "200":
        $ref: '../components/responses/BusinessSettingsSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Settings]
    summary: Actualizar la configuración básica del negocio activo
    description: >
      Actualización autenticada (HU-020, CA-020-02) de nombre, zona horaria
      IANA y contacto opcional. El cuerpo declara únicamente `name`,
      `timezone`, `contactEmail` y `contactPhone`; cualquier otro campo -en
      particular un identificador de negocio- se rechaza como forma
      inválida (`CA-020-05`). `contactEmail`/`contactPhone` vacíos
      significan "sin contacto": el servidor los normaliza a ausencia antes
      de guardar y nunca los registra en texto plano (`CA-020-06`). La zona
      se confirma contra el catálogo real de zonas IANA del servidor dentro
      de la misma operación que la escritura: una zona no reconocida
      responde `422` sin modificar ningún campo, ni siquiera los que sí
      eran válidos (`CA-020-03`). La respuesta exitosa devuelve la
      representación completa ya guardada, la misma forma que `GET`.
    operationId: updateBusinessSettings
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-07, RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBusinessSettingsRequest.yaml'
          examples:
            actualizacionCompleta:
              summary: Nombre, zona y contacto completo
              value:
                name: Negocio Ejemplo
                timezone: America/Bogota
                contactEmail: contacto@ejemplo.test
                contactPhone: "+573001234567"
            sinContacto:
              summary: Sin correo ni teléfono de contacto
              value:
                name: Negocio Ejemplo
                timezone: America/Bogota
                contactEmail: ""
                contactPhone: ""
    responses:
      "200":
        $ref: '../components/responses/BusinessSettingsUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BusinessSettingsValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/booking-policy:
  get:
    tags: [Settings]
    summary: Consultar la política pública de reserva y cancelación
    description: >
      Lectura autenticada (HU-093, CA-093-01) de anticipación mínima,
      ventana máxima, rejilla, plazo de cancelación y política de
      cancelación tardía del negocio derivado de la sesión vigente. Un
      negocio nuevo recibe exactamente los defaults de DEC-083 (60/3/15/20
      minutos-días, `lateCancellationClientAllowed`/
      `lateCancellationReasonRequired` en `true`). `businessId` nunca es
      un parámetro de esta operación -el tenant se deriva exclusivamente de
      `SessionCookie`- (CA-093-03).
    operationId: getBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-CAN-01, RN-CAN-02, RN-TEN-01]
    x-decisions: [DEC-005, DEC-006, DEC-010, DEC-018, DEC-024, DEC-083]
    responses:
      "200":
        $ref: '../components/responses/BookingPolicySuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  put:
    tags: [Settings]
    summary: Actualizar la política pública de reserva y cancelación
    description: >
      Reemplazo completo y autenticado (HU-093, CA-093-02) de los seis
      campos de la política pública, protegido por la precondición de
      versión `If-Match` (concurrencia optimista, mismo criterio que
      `HU-065`): si la representación vigente ya cambió, responde `409` con
      `code: version-conflict` en vez de aplicar un último escritor
      silencioso. Cada campo se valida contra su rango (`DEC-083`; la
      rejilla `slotGridMinutes`, entero de 1 a 60, `DEC-133`);
      `lateCancellationReasonRequired` no puede ser `true` si
      `lateCancellationClientAllowed` es `false` (combinación incoherente),
      y `minAdvanceMinutes` no puede alcanzar ni superar
      `maxAdvanceDays * 1440`. Un campo fuera de rango o una combinación
      incoherente responde `422` sin escribir nada, ni siquiera
      parcialmente (`CA-093-02`). Cambiar la política nunca reescribe citas,
      historial ni cancelaciones ya realizadas (`CA-093-04`). El cuerpo no
      declara `businessId`: el tenant se deriva exclusivamente de
      `SessionCookie` (`CA-093-03`).
    operationId: updateBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-CAN-01, RN-CAN-02, RN-TEN-01]
    x-decisions: [DEC-005, DEC-006, DEC-010, DEC-018, DEC-024, DEC-083]
    parameters:
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBookingPolicyRequest.yaml'
          examples:
            actualizacionCompleta:
              summary: Anticipación, ventana, rejilla y cancelación tardía personalizadas
              value:
                minAdvanceMinutes: 90
                maxAdvanceDays: 5
                slotGridMinutes: 30
                cancellationDeadlineMinutes: 60
                lateCancellationClientAllowed: false
                lateCancellationReasonRequired: false
    responses:
      "200":
        $ref: '../components/responses/BookingPolicyUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          El `If-Match` enviado ya no coincide con la representación
          vigente porque otra escritura tocó el negocio primero
          (`code: version-conflict`).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              versionDesactualizada:
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: la política de reserva cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/BookingPolicyValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/booking-policy/professionals:
  get:
    tags: [Settings]
    summary: Listar las ventanas de reserva propias de los profesionales
    description: >
      Lectura autenticada (DEC-169) de las ventanas de reserva públicas
      propias de los profesionales del negocio de la sesión (para una cuenta de
      empleado, `DEC-173`, solo la de su propio profesional): anticipación
      mínima, ventana máxima y rejilla. Un profesional que no aparece hereda la
      política del negocio (`getBookingPolicy`), incluidos sus cambios
      futuros. El plazo y la política de cancelación no son por profesional.
    operationId: listProfessionalBookingPolicies
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-TEN-01]
    x-decisions: [DEC-024, DEC-083, DEC-133, DEC-169]
    responses:
      "200":
        $ref: '../components/responses/ProfessionalBookingPolicyListSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/booking-policy/professionals/{professionalId}:
  parameters:
    - name: professionalId
      in: path
      required: true
      description: Identificador del profesional del negocio de la sesión.
      schema:
        type: string
        format: uuid
      examples:
        profesional:
          value: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d
  put:
    tags: [Settings]
    summary: Guardar la ventana de reserva propia de un profesional
    description: >
      Reemplazo completo e idempotente (DEC-169) de la ventana propia del
      profesional: mismos rangos y misma coherencia que la del negocio
      (`DEC-083`; rejilla entera de 1 a 60, `DEC-133`; la anticipación no
      puede alcanzar ni superar `maxAdvanceDays * 1440`). Sin `If-Match`:
      cada escritura deja un estado completo y válido (último escritor). Un
      profesional inexistente, de otro negocio o con identificador mal formado
      responde el mismo `404`, sin escribir nada. Rige desde ya la
      disponibilidad pública y la revalidación al confirmar de ese profesional;
      no cambia citas existentes ni la creación manual.
    operationId: putProfessionalBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-TEN-01]
    x-decisions: [DEC-024, DEC-083, DEC-133, DEC-169]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/PutProfessionalBookingPolicyRequest.yaml'
          examples:
            ventanaPropia:
              summary: Corta cada 40 minutos y recibe reservas con 30 minutos de anticipación
              value:
                minAdvanceMinutes: 30
                maxAdvanceDays: 7
                slotGridMinutes: 40
    responses:
      "200":
        $ref: '../components/responses/ProfessionalBookingPolicySaved.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/ProfessionalBookingPolicyValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  delete:
    tags: [Settings]
    summary: Quitar la ventana propia de un profesional (vuelve a heredar)
    description: >
      Borra la ventana propia del profesional (DEC-169): desde ese momento hereda
      la política del negocio. Idempotente: responde `204` también si no
      tenía una. Un identificador mal formado responde `404`.
    operationId: deleteProfessionalBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-TEN-01]
    x-decisions: [DEC-024, DEC-169]
    responses:
      "204":
        $ref: '../components/responses/ProfessionalBookingPolicyDeleted.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/brand:
  get:
    tags: [Settings]
    summary: Consultar la marca y el vocabulario del negocio activo
    description: >
      Lectura autenticada (issue #292, DEC-110) del color de acento y del
      vocabulario (palabra del negocio y del profesional, con plural y
      género gramatical) del negocio derivado de la sesión vigente. Un
      negocio que nunca los cambió recibe los valores iniciales (`brass`,
      `negocio`, `profesional`), exactamente la interfaz anterior. Incluye el
      panel del usuario que consulta (`panelProfile`), derivado de sus roles en
      la base de datos (`DEC-134`) y no de un ajuste del negocio. Recurso
      propio, separado de `/private/settings/business` para no ampliar el
      contrato cerrado de `HU-020` (`CA-020-07`). `businessId` nunca es un
      parámetro: el tenant se deriva exclusivamente de `SessionCookie`.
    operationId: getBrand
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024, DEC-110, DEC-115, DEC-130, DEC-134]
    responses:
      "200":
        $ref: '../components/responses/BrandSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Settings]
    summary: Actualizar la marca y el vocabulario del negocio activo
    description: >
      Actualización autenticada (issue #292, DEC-110) de los seis campos de
      marca y vocabulario, que viajan siempre presentes; cualquier otro
      campo -en particular un identificador de negocio o `panelProfile`, que
      desde `DEC-134` lo deciden los roles del usuario- se rechaza como
      forma inválida. `accent` pertenece a una lista cerrada (nunca un color
      libre) y cada término se recorta, se colapsa y se pasa a minúsculas
      antes de validarlo y guardarlo. `hasPhysicalLocation` y `address` son
      opcionales (`DEC-130`, `HU-102`): ausentes no tocan la ubicación; una
      dirección nueva se geocodifica en el servidor antes de guardar y, si no se
      puede ubicar con precisión de calle, responde `422` sin escribir nada (ni
      la marca); apagar el interruptor conserva la dirección y sus coordenadas.
      Con `latitude`/`longitude` (`DEC-170`), el punto que el dueño ajustó a
      mano en el mapa, el servidor guarda ese punto junto a la dirección sin
      geocodificarla.
      Un valor inválido responde `422` sin escribir nada. Son preferencias de presentación: no hay precondición de
      versión y la última escritura gana. Escribir toca `updated_at` de la
      fila, así que invalida el token `If-Match` de una política de reserva
      leída antes (`HU-093`), igual que una escritura de `HU-020`. La
      respuesta devuelve la representación canónica ya guardada, la misma
      forma que `GET`.
    operationId: updateBrand
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024, DEC-110, DEC-115, DEC-130, DEC-134]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBrandRequest.yaml'
          examples:
            salonConEstilistas:
              summary: Salón de belleza con estilistas y acento esmeralda
              value:
                accent: emerald
                businessTerm: salón de belleza
                businessTermGender: masculine
                professionalTerm: estilista
                professionalTermPlural: estilistas
                professionalTermGender: feminine
            conLocal:
              summary: Fijar la dirección del local (se geocodifica al guardar)
              value:
                accent: brass
                businessTerm: negocio
                businessTermGender: feminine
                professionalTerm: profesional
                professionalTermPlural: profesionales
                professionalTermGender: masculine
                hasPhysicalLocation: true
                address: Calle 10 # 5-20, Bogotá
            valoresIniciales:
              summary: Volver a los valores iniciales
              value:
                accent: brass
                businessTerm: negocio
                businessTermGender: feminine
                professionalTerm: profesional
                professionalTermPlural: profesionales
                professionalTermGender: masculine
    responses:
      "200":
        $ref: '../components/responses/BrandUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "403":
        $ref: '../components/responses/ForbiddenProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BrandValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/public-link:
